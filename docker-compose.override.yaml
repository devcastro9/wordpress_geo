services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"

  wordpress:
    image: wordpress:7.1-php8.3-apache
    ports:
      - "${WP_PORT}:80"
    environment:
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp_core:/var/www/html
      - uploads:/var/www/html/wp-content/uploads
      - ./wp-content/plugins/directorio-core:/var/www/html/wp-content/plugins/directorio-core
      - ./wp-content/themes/directorio-child:/var/www/html/wp-content/themes/directorio-child
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp_core:/var/www/html
      - uploads:/var/www/html/wp-content/uploads
      - ./wp-content/plugins/directorio-core:/var/www/html/wp-content/plugins/directorio-core
      - ./wp-content/themes/directorio-child:/var/www/html/wp-content/themes/directorio-child
    profiles: ["tools"]

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAIL_PORT}:8025"

volumes:
  wp_core:
  uploads: